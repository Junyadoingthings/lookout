<!--
  Shared agent config, pushed from the Wazuh manager to every agent in the
  "default" group. Lives on the Ubuntu VM at /var/ossec/etc/shared/default/agent.conf.

  The Windows agent already reads the Security, System and Application logs by
  default. This adds the two channels the lab depends on:
    - Sysmon: process creation, network connections, registry changes, etc.
    - PowerShell Operational: script block logging (event 4104), which records
      the decoded text of what PowerShell actually ran, even for -EncodedCommand.
-->
<agent_config os="Windows">
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
